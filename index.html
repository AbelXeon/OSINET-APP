<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OSINT // CONSOLE</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    :root {
      --bg: #F4F0EA;
      --card-bg: #FFFFFF;
      --accent: #FFE600;
      --primary: #000000;
      --border-w: 4px;
      --shadow-offset: 6px;
      --gap: 20px;
      --pad: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--primary);
      padding: var(--pad);
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    .brutal-box {
      background: var(--card-bg);
      border: var(--border-w) solid var(--primary);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--primary);
      padding: 16px;
      margin-bottom: var(--gap);
    }

    header {
      background: var(--accent);
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: -1px;
    }

    h1 {
      font-size: clamp(1.25rem, 6vw, 2.2rem);
      line-height: 1.05;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px 12px;
      overflow-wrap: anywhere;
    }

    .badge {
      font-size: 0.7rem;
      background: #000;
      color: #FFF;
      padding: 4px 8px;
      letter-spacing: 0;
      white-space: nowrap;
    }

    /* Tool Selector Grid */
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
      gap: 8px;
      margin-bottom: var(--gap);
    }

    .btn-tool {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 48px;
      background: #FFF;
      border: 3px solid var(--primary);
      box-shadow: 3px 3px 0px var(--primary);
      padding: 10px 6px;
      font: inherit;
      font-size: 0.7rem;
      font-weight: bold;
      line-height: 1.1;
      text-transform: uppercase;
      overflow-wrap: anywhere;
      cursor: pointer;
      text-align: center;
      transition: all 0.1s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-tool .ico {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .btn-tool:hover {
      background: #E0E0E0;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px var(--primary);
    }

    .btn-tool.active {
      background: var(--accent);
      box-shadow: inset 2px 2px 0px var(--primary);
      transform: translate(2px, 2px);
    }

    /* Execution Form */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    input[type="text"] {
      flex: 1;
      width: 100%;
      min-width: 0;
      border: 3px solid var(--primary);
      padding: 12px;
      font: inherit;
      font-size: 16px;
      font-weight: bold;
      outline: none;
      background: #FFF;
    }

    input[type="text"]:focus {
      background: #FFFFF0;
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .file-upload-zone {
      display: none;
      margin-top: 10px;
      flex-direction: column;
      gap: 8px;
    }

    .file-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      border: 3px dashed var(--primary);
      padding: 14px 12px;
      text-align: center;
      font-weight: bold;
      font-size: 0.8rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
      cursor: pointer;
      text-transform: uppercase;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .file-btn .ico {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .btn-exec {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 52px;
      background: #FF5C5C;
      color: #000;
      font: inherit;
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
      border: 3px solid var(--primary);
      box-shadow: 4px 4px 0px var(--primary);
      padding: 12px 24px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-exec .ico {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .btn-exec:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--primary);
    }

    .field-label {
      display: block;
      margin-bottom: 10px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      overflow-wrap: anywhere;
    }

    .buffer-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .buffer-label::before {
      content: '';
      width: 12px;
      height: 12px;
      background: var(--primary);
      flex: 0 0 auto;
    }

    /* Terminal Console Output */
    .console-out {
      background: #000;
      color: #00FF66;
      border: var(--border-w) solid var(--primary);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--primary);
      padding: 12px;
      min-height: 180px;
      max-height: 60vh;
      overflow-y: auto;
      font-size: 0.75rem;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .links-tray {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .link-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      background: #FFF;
      color: #000;
      text-decoration: none;
      border: 2px solid #000;
      padding: 8px 10px;
      font-size: 0.72rem;
      font-weight: bold;
      text-transform: uppercase;
      overflow-wrap: anywhere;
      box-shadow: 2px 2px 0px #000;
      -webkit-tap-highlight-color: transparent;
    }

    .link-tag .ico {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
    }

    .link-tag:hover {
      background: var(--accent);
    }

    :focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    /* Tablet and desktop */
    @media (min-width: 640px) {
      :root {
        --gap: 24px;
        --pad: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      }

      .brutal-box {
        padding: 24px;
      }

      .tool-grid {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
      }

      .btn-tool {
        gap: 8px;
        font-size: 0.78rem;
      }

      .btn-tool .ico {
        width: 18px;
        height: 18px;
      }

      .file-btn {
        font-size: 0.85rem;
      }

      .input-group {
        flex-direction: row;
        gap: 12px;
      }

      .btn-exec {
        width: auto;
      }

      .console-out {
        padding: 16px;
        min-height: 200px;
        max-height: 480px;
        font-size: 0.85rem;
      }

      .link-tag {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header class="brutal-box">
    <h1>
      <span>[OSINT::RAW]</span>
      <span class="badge">PRO SUITE</span>
    </h1>
  </header>

  <div class="tool-grid">
    <button class="btn-tool active" data-tool="ip" onclick="setTool('ip', '8.8.8.8')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
      <span>IP</span>
    </button>
    <button class="btn-tool" data-tool="domain" onclick="setTool('domain', 'example.com')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      <span>Domain</span>
    </button>
    <button class="btn-tool" data-tool="phone" onclick="setTool('phone', '+251911234567')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
      <span>Phone</span>
    </button>
    <button class="btn-tool" data-tool="tg" onclick="setTool('tg', '@durov')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
      <span>Telegram</span>
    </button>
    <button class="btn-tool" data-tool="email" onclick="setTool('email', 'target@example.com')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      <span>Email</span>
    </button>
    <button class="btn-tool" data-tool="breach" onclick="setTool('breach', 'target@example.com')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <span>Breach</span>
    </button>
    <button class="btn-tool" data-tool="name" onclick="setTool('name', 'Abel Tiruneh')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Name</span>
    </button>
    <button class="btn-tool" data-tool="dork" onclick="setTool('dork', 'target')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span>Dork</span>
    </button>
    <button class="btn-tool" data-tool="image" onclick="setTool('image', '')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      <span>Image</span>
    </button>
  </div>

  <section class="brutal-box">
    <label class="field-label" id="input-label">IP TARGET ENTRY</label>

    <div class="input-group" id="text-input-wrap">
      <input type="text" id="target-input" placeholder="8.8.8.8" autocomplete="off" spellcheck="false">
      <button class="btn-exec" onclick="runScan()">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
        <span>EXECUTE</span>
      </button>
    </div>

    <div class="file-upload-zone" id="file-zone">
      <input type="file" id="image-file" accept="image/*" style="display:none" onchange="onFileSelected(this)">
      <label for="image-file" class="file-btn">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
        <span>CLICK TO SELECT PHOTO (OR TAKE CAMERA SHOT)</span>
      </label>
      <div id="file-status" style="font-size: 0.75rem; font-weight: bold; overflow-wrap: anywhere;">No file chosen</div>
    </div>
  </section>

  <section>
    <div class="buffer-label">OUTPUT BUFFER</div>
    <div class="console-out" id="terminal">&gt; Console ready. Select tool and execute target lookup...</div>
    <div class="links-tray" id="links-container"></div>
  </section>
</div>

<script>
  var SVG_OPEN = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';

  var ICON = {
    map: SVG_OPEN + '<path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg>',
    radar: SVG_OPEN + '<path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></svg>',
    shield: SVG_OPEN + '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>',
    history: SVG_OPEN + '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>',
    whatsapp: SVG_OPEN + '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',
    telegram: SVG_OPEN + '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>',
    fingerprint: SVG_OPEN + '<path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>',
    search: SVG_OPEN + '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
    globe: SVG_OPEN + '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>',
    eye: SVG_OPEN + '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>',
    image: SVG_OPEN + '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>',
    pin: SVG_OPEN + '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>'
  };

  var currentTool = 'ip';
  var selectedImageBase64 = null;

  function setTool(tool, sample) {
    currentTool = tool;
    document.querySelectorAll('.btn-tool').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.tool === tool);
    });

    var input = document.getElementById('target-input');
    var fileZone = document.getElementById('file-zone');
    var label = document.getElementById('input-label');

    if (tool === 'image') {
      label.innerText = 'IMAGE EXIF & REVERSE SEARCH';
      fileZone.style.display = 'flex';
      input.placeholder = 'Or paste image URL (optional)';
    } else {
      label.innerText = tool.toUpperCase() + ' TARGET ENTRY';
      fileZone.style.display = 'none';
      input.placeholder = sample;
    }
  }

  function onFileSelected(el) {
    if (el.files && el.files[0]) {
      var file = el.files[0];
      document.getElementById('file-status').innerText = 'Selected: ' + file.name + ' (' + Math.round(file.size / 1024) + ' KB)';
      var reader = new FileReader();
      reader.onload = function(e) {
        selectedImageBase64 = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  }

  async function runScan() {
    var input = document.getElementById('target-input');
    var target = input.value.trim() || input.placeholder;
    var term = document.getElementById('terminal');
    var tray = document.getElementById('links-container');
    tray.innerHTML = '';

    term.innerText = '> Querying [' + currentTool.toUpperCase() + ']...\n> Connecting to API edge...';

    try {
      var data;
      if (currentTool === 'image' && selectedImageBase64) {
        var res = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tool: 'image', image: selectedImageBase64 })
        });
        if (!res.ok) throw new Error('HTTP Error: ' + res.status);
        data = await res.json();
      } else {
        var res = await fetch('/api/scan?tool=' + encodeURIComponent(currentTool) + '&target=' + encodeURIComponent(target));
        if (!res.ok) throw new Error('HTTP Error: ' + res.status);
        data = await res.json();
      }

      term.innerText = JSON.stringify(data, null, 2);

      // Contextual Link Tray
      if (currentTool === 'ip') {
        renderLink(ICON.map, 'Map', 'https://www.google.com/maps?q=' + target);
        renderLink(ICON.radar, 'Shodan', 'https://www.shodan.io/host/' + target);
      } else if (currentTool === 'domain') {
        renderLink(ICON.shield, 'VirusTotal', 'https://www.virustotal.com/gui/domain/' + target);
        renderLink(ICON.history, 'Wayback', 'https://web.archive.org/web/*/' + target);
      } else if (currentTool === 'phone') {
        var cleanDigits = target.replace(/[^0-9]/g, '');
        renderLink(ICON.whatsapp, 'WhatsApp', 'https://wa.me/' + cleanDigits);
        renderLink(ICON.telegram, 'Telegram', 'https://t.me/+' + cleanDigits);
      } else if (currentTool === 'tg') {
        var u = target.replace('@', '');
        renderLink(ICON.telegram, 'Open Telegram', 'https://t.me/' + u);
      } else if (currentTool === 'email' || currentTool === 'breach') {
        renderLink(ICON.shield, 'Have I Been Pwned', 'https://haveibeenpwned.com/account/' + encodeURIComponent(target));
        renderLink(ICON.fingerprint, 'Epieos', 'https://epieos.com/?q=' + encodeURIComponent(target));
      } else if (currentTool === 'name' && data.dork_searches) {
        data.dork_searches.forEach(function(s) {
          renderLink(ICON.search, s.platform, 'https://www.google.com/search?q=' + encodeURIComponent(s.query));
        });
      } else if (currentTool === 'image') {
        renderLink(ICON.search, 'Google Lens', 'https://lens.google.com/');
        renderLink(ICON.globe, 'Yandex', 'https://yandex.com/images/');
        renderLink(ICON.eye, 'TinEye', 'https://tineye.com/');
        renderLink(ICON.image, 'Bing Visual', 'https://www.bing.com/visualsearch');
        if (data.gps && data.gps.map_url) {
          renderLink(ICON.pin, 'View GPS on Map', data.gps.map_url);
        }
      }
    } catch (err) {
      term.innerText = '[!] TASK FAILED\n' + err.message;
    }
  }

  function renderLink(icon, name, url) {
    var a = document.createElement('a');
    a.className = 'link-tag';
    a.innerHTML = icon + '<span>' + name + '</span>';
    a.href = url;
    a.target = '_blank';
    document.getElementById('links-container').appendChild(a);
  }

  // Register PWA Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js')
        .catch(function (err) { console.log('SW registration failed: ', err); });
    });
  }
</script>

</body>
</html>

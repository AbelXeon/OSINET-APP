<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OSINT // CONSOLE</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    :root {
      --bg: #F4F0EA;
      --card-bg: #FFFFFF;
      --accent: #FFE600;
      --primary: #000000;
      --border-w: 4px;
      --shadow-offset: 6px;
      --gap: 20px;
      --pad: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--primary);
      padding: var(--pad);
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    .brutal-box {
      background: var(--card-bg);
      border: var(--border-w) solid var(--primary);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--primary);
      padding: 18px;
      margin-bottom: var(--gap);
    }

    header {
      background: var(--accent);
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: -1px;
    }

    h1 {
      font-size: clamp(1.35rem, 6vw, 2.2rem);
      line-height: 1.05;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px 12px;
    }

    .badge {
      font-size: 0.7rem;
      background: #000;
      color: #FFF;
      padding: 4px 8px;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: var(--gap);
    }

    .btn-tool {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      background: #FFF;
      border: 3px solid var(--primary);
      box-shadow: 3px 3px 0px var(--primary);
      padding: 10px 6px;
      font: inherit;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      transition: all 0.1s ease;
      touch-action: manipulation;
    }

    .btn-tool .ico {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .btn-tool:hover {
      background: #E0E0E0;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px var(--primary);
    }

    .btn-tool.active {
      background: var(--accent);
      box-shadow: inset 2px 2px 0px var(--primary);
      transform: translate(2px, 2px);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    input[type="text"] {
      flex: 1;
      width: 100%;
      min-width: 0;
      border: 3px solid var(--primary);
      padding: 12px;
      font: inherit;
      font-size: 16px;
      font-weight: bold;
      outline: none;
      background: #FFF;
    }

    input[type="text"]:focus {
      background: #FFFFF0;
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .file-upload-zone {
      display: none;
      margin-top: 10px;
      flex-direction: column;
      gap: 8px;
    }

    .file-btn {
      background: var(--accent);
      border: 3px dashed var(--primary);
      padding: 14px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .btn-exec {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 52px;
      background: #FF5C5C;
      color: #000;
      font: inherit;
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
      border: 3px solid var(--primary);
      box-shadow: 4px 4px 0px var(--primary);
      padding: 12px 24px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-exec:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--primary);
    }

    .field-label {
      display: block;
      margin-bottom: 10px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .buffer-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .buffer-label::before {
      content: '';
      width: 12px;
      height: 12px;
      background: var(--primary);
      flex: 0 0 auto;
    }

    .console-out {
      background: #000;
      color: #00FF66;
      border: var(--border-w) solid var(--primary);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--primary);
      padding: 14px;
      min-height: 180px;
      max-height: 60vh;
      overflow-y: auto;
      font-size: 0.8rem;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .links-tray {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .link-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFF;
      color: #000;
      text-decoration: none;
      border: 2px solid #000;
      padding: 8px 10px;
      font-size: 0.72rem;
      font-weight: bold;
      text-transform: uppercase;
      box-shadow: 2px 2px 0px #000;
    }

    .link-tag:hover {
      background: var(--accent);
    }

    @media (min-width: 640px) {
      .input-group {
        flex-direction: row;
      }
      .btn-exec {
        width: auto;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header class="brutal-box">
    <h1>
      <span>[OSINT::RAW]</span>
      <span class="badge">PRO SUITE</span>
    </h1>
  </header>

  <div class="tool-grid">
    <button class="btn-tool active" data-tool="ip" onclick="setTool('ip', '8.8.8.8')">
      <span>📡 IP</span>
    </button>
    <button class="btn-tool" data-tool="domain" onclick="setTool('domain', 'example.com')">
      <span>🌐 Domain</span>
    </button>
    <button class="btn-tool" data-tool="phone" onclick="setTool('phone', '+251911234567')">
      <span>📱 Phone</span>
    </button>
    <button class="btn-tool" data-tool="tg" onclick="setTool('tg', '@durov')">
      <span>✈️ Telegram</span>
    </button>
    <button class="btn-tool" data-tool="email" onclick="setTool('email', 'target@example.com')">
      <span>📧 Email</span>
    </button>
    <button class="btn-tool" data-tool="breach" onclick="setTool('breach', 'target@example.com')">
      <span>💥 Breach</span>
    </button>
    <button class="btn-tool" data-tool="name" onclick="setTool('name', 'Abel Tiruneh')">
      <span>🧑 Name</span>
    </button>
    <button class="btn-tool" data-tool="dork" onclick="setTool('dork', 'target')">
      <span>🕵️ Dork</span>
    </button>
    <button class="btn-tool" data-tool="image" onclick="setTool('image', '')">
      <span>📷 Image</span>
    </button>
  </div>

  <section class="brutal-box">
    <label class="field-label" id="input-label">IP TARGET ENTRY</label>
    
    <div class="input-group" id="text-input-wrap">
      <input type="text" id="target-input" placeholder="8.8.8.8" autocomplete="off" spellcheck="false">
      <button class="btn-exec" onclick="runScan()">
        <span>EXECUTE</span>
      </button>
    </div>

    <div class="file-upload-zone" id="file-zone">
      <input type="file" id="image-file" accept="image/*" style="display:none" onchange="onFileSelected(this)">
      <label for="image-file" class="file-btn">📁 CLICK TO SELECT PHOTO (OR TAKE CAMERA SHOT)</label>
      <div id="file-status" style="font-size: 0.75rem; font-weight: bold;">No file chosen</div>
    </div>
  </section>

  <section>
    <div class="buffer-label">OUTPUT BUFFER</div>
    <div class="console-out" id="terminal">&gt; Console ready. Select tool and execute target lookup...</div>
    <div class="links-tray" id="links-container"></div>
  </section>
</div>

<script>
  var currentTool = 'ip';
  var selectedImageBase64 = null;

  function setTool(tool, sample) {
    currentTool = tool;
    document.querySelectorAll('.btn-tool').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.tool === tool);
    });

    var input = document.getElementById('target-input');
    var fileZone = document.getElementById('file-zone');
    var label = document.getElementById('input-label');

    if (tool === 'image') {
      label.innerText = 'IMAGE EXIF & REVERSE SEARCH';
      fileZone.style.display = 'flex';
      input.placeholder = 'Or paste image URL (optional)';
    } else {
      label.innerText = tool.toUpperCase() + ' TARGET ENTRY';
      fileZone.style.display = 'none';
      input.placeholder = sample;
    }
  }

  function onFileSelected(el) {
    if (el.files && el.files[0]) {
      var file = el.files[0];
      document.getElementById('file-status').innerText = 'Selected: ' + file.name + ' (' + Math.round(file.size / 1024) + ' KB)';
      var reader = new FileReader();
      reader.onload = function(e) {
        selectedImageBase64 = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  }

  async function runScan() {
    var input = document.getElementById('target-input');
    var target = input.value.trim() || input.placeholder;
    var term = document.getElementById('terminal');
    var tray = document.getElementById('links-container');
    tray.innerHTML = '';

    term.innerText = '> Querying [' + currentTool.toUpperCase() + ']...\n> Connecting to API edge...';

    try {
      var data;
      if (currentTool === 'image' && selectedImageBase64) {
        var res = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tool: 'image', image: selectedImageBase64 })
        });
        if (!res.ok) throw new Error('HTTP Error: ' + res.status);
        data = await res.json();
      } else {
        var res = await fetch('/api/scan?tool=' + encodeURIComponent(currentTool) + '&target=' + encodeURIComponent(target));
        if (!res.ok) throw new Error('HTTP Error: ' + res.status);
        data = await res.json();
      }

      term.innerText = JSON.stringify(data, null, 2);

      // Contextual Link Tray
      if (currentTool === 'ip') {
        renderLink('🗺 Map', 'https://www.google.com/maps?q=' + target);
        renderLink('📡 Shodan', 'https://www.shodan.io/host/' + target);
      } else if (currentTool === 'domain') {
        renderLink('🛡 VirusTotal', 'https://www.virustotal.com/gui/domain/' + target);
        renderLink('🕰 Wayback', 'https://web.archive.org/web/*/' + target);
      } else if (currentTool === 'phone') {
        var cleanDigits = target.replace(/[^0-9]/g, '');
        renderLink('💬 WhatsApp', 'https://wa.me/' + cleanDigits);
        renderLink('✈️ Telegram', 'https://t.me/+' + cleanDigits);
      } else if (currentTool === 'tg') {
        var u = target.replace('@', '');
        renderLink('✈️ Open Telegram', 'https://t.me/' + u);
      } else if (currentTool === 'email' || currentTool === 'breach') {
        renderLink('🛡 Have I Been Pwned', 'https://haveibeenpwned.com/account/' + encodeURIComponent(target));
        renderLink('🧬 Epieos', 'https://epieos.com/?q=' + encodeURIComponent(target));
      } else if (currentTool === 'name' && data.dork_searches) {
        data.dork_searches.forEach(function(s) {
          renderLink('🔍 ' + s.platform, 'https://www.google.com/search?q=' + encodeURIComponent(s.query));
        });
      } else if (currentTool === 'image') {
        renderLink('🔍 Google Lens', 'https://lens.google.com/');
        renderLink('🇷🇺 Yandex', 'https://yandex.com/images/');
        renderLink('👁 TinEye', 'https://tineye.com/');
        renderLink('🅱️ Bing Visual', 'https://www.bing.com/visualsearch');
        if (data.gps && data.gps.map_url) {
          renderLink('📍 View GPS on Map', data.gps.map_url);
        }
      }
    } catch (err) {
      term.innerText = '[!] TASK FAILED\n' + err.message;
    }
  }

  function renderLink(name, url) {
    var a = document.createElement('a');
    a.className = 'link-tag';
    a.innerText = name;
    a.href = url;
    a.target = '_blank';
    document.getElementById('links-container').appendChild(a);
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js')
        .catch(function (err) { console.log('SW registration failed: ', err); });
    });
  }
</script>

</body>
</html>

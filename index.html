<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OSINT // CONSOLE</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    :root {
      --bg: #F4F0EA;
      --card-bg: #FFFFFF;
      --accent: #FFE600;
      --primary: #000000;
      --border-w: 4px;
      --shadow-offset: 6px;
      --gap: 20px;
      --pad: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--primary);
      padding: var(--pad);
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    /* Neo-Brutalist Box Utility */
    .brutal-box {
      background: var(--card-bg);
      border: var(--border-w) solid var(--primary);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--primary);
      padding: 18px;
      margin-bottom: var(--gap);
    }

    header {
      background: var(--accent);
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: -1px;
    }

    h1 {
      font-size: clamp(1.35rem, 6vw, 2.2rem);
      line-height: 1.05;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px 12px;
      overflow-wrap: anywhere;
    }

    .badge {
      font-size: 0.7rem;
      background: #000;
      color: #FFF;
      padding: 4px 8px;
      letter-spacing: 0;
      white-space: nowrap;
    }

    /* Tool Selector Grid */
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: var(--gap);
    }

    .btn-tool {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      background: #FFF;
      border: 3px solid var(--primary);
      box-shadow: 3px 3px 0px var(--primary);
      padding: 12px 8px;
      font: inherit;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      transition: all 0.1s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-tool .ico {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .btn-tool:hover {
      background: #E0E0E0;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px var(--primary);
    }

    .btn-tool.active {
      background: var(--accent);
      box-shadow: inset 2px 2px 0px var(--primary);
      transform: translate(2px, 2px);
    }

    /* Execution Form */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    input[type="text"] {
      flex: 1;
      width: 100%;
      min-width: 0;
      border: 3px solid var(--primary);
      padding: 12px;
      font: inherit;
      font-size: 16px;
      font-weight: bold;
      outline: none;
      background: #FFF;
    }

    input[type="text"]:focus {
      background: #FFFFF0;
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-exec {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 52px;
      background: #FF5C5C;
      color: #000;
      font: inherit;
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
      border: 3px solid var(--primary);
      box-shadow: 4px 4px 0px var(--primary);
      padding: 12px 24px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-exec .ico {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .btn-exec:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--primary);
    }

    .field-label {
      display: block;
      margin-bottom: 10px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .buffer-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .buffer-label::before {
      content: '';
      width: 12px;
      height: 12px;
      background: var(--primary);
      flex: 0 0 auto;
    }

    /* Terminal Console Output */
    .console-out {
      background: #000;
      color: #00FF66;
      border: var(--border-w) solid var(--primary);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--primary);
      padding: 14px;
      min-height: 180px;
      max-height: 60vh;
      overflow-y: auto;
      font-size: 0.8rem;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .links-tray {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .link-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      background: #FFF;
      color: #000;
      text-decoration: none;
      border: 2px solid #000;
      padding: 8px 10px;
      font-size: 0.72rem;
      font-weight: bold;
      text-transform: uppercase;
      box-shadow: 2px 2px 0px #000;
      overflow-wrap: anywhere;
      -webkit-tap-highlight-color: transparent;
    }

    .link-tag .ico {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
    }

    .link-tag:hover {
      background: var(--accent);
    }

    :focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    /* Tablet and desktop */
    @media (min-width: 640px) {
      :root {
        --gap: 24px;
        --pad: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      }

      .brutal-box {
        padding: 24px;
      }

      .tool-grid {
        gap: 12px;
      }

      .btn-tool {
        font-size: 0.85rem;
      }

      .input-group {
        flex-direction: row;
        gap: 12px;
      }

      .btn-exec {
        width: auto;
      }

      .console-out {
        padding: 16px;
        min-height: 200px;
        max-height: 480px;
        font-size: 0.85rem;
      }

      .link-tag {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header class="brutal-box">
    <h1>
      <span>[OSINT::RAW]</span>
      <span class="badge">PWA V1</span>
    </h1>
  </header>

  <div class="tool-grid">
    <button class="btn-tool active" data-tool="ip" onclick="setTool('ip', '8.8.8.8')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
      <span>IP</span>
    </button>
    <button class="btn-tool" data-tool="domain" onclick="setTool('domain', 'example.com')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      <span>Domain</span>
    </button>
    <button class="btn-tool" data-tool="phone" onclick="setTool('phone', '+251911234567')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
      <span>Phone</span>
    </button>
    <button class="btn-tool" data-tool="dork" onclick="setTool('dork', 'target')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span>Dork</span>
    </button>
  </div>

  <section class="brutal-box">
    <label class="field-label" id="input-label">TARGET IDENTIFIER</label>
    <div class="input-group">
      <input type="text" id="target-input" placeholder="8.8.8.8" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="btn-exec" onclick="runScan()">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
        <span>EXECUTE</span>
      </button>
    </div>
  </section>

  <section>
    <div class="buffer-label">OUTPUT BUFFER</div>
    <div class="console-out" id="terminal">&gt; Console ready. Select tool and execute target lookup...</div>
    <div class="links-tray" id="links-container"></div>
  </section>
</div>

<script>
  var ICON = {
    map: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg>',
    radar: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></svg>',
    shield: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>',
    history: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>'
  };

  var currentTool = 'ip';

  function setTool(tool, sample) {
    currentTool = tool;
    document.querySelectorAll('.btn-tool').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.tool === tool);
    });
    var input = document.getElementById('target-input');
    input.placeholder = sample;
    document.getElementById('input-label').innerText = tool.toUpperCase() + ' TARGET ENTRY';
  }

  async function runScan() {
    var input = document.getElementById('target-input');
    var target = input.value.trim() || input.placeholder;
    var term = document.getElementById('terminal');
    var tray = document.getElementById('links-container');
    tray.innerHTML = '';

    term.innerText = '> Querying [' + currentTool.toUpperCase() + '] against target: "' + target + '"...\n> Connecting to API edge...';

    try {
      var res = await fetch('/api/scan?tool=' + encodeURIComponent(currentTool) + '&target=' + encodeURIComponent(target));
      if (!res.ok) throw new Error('HTTP Error: ' + res.status);
      var data = await res.json();
      term.innerText = JSON.stringify(data, null, 2);

      // Dynamically add quick external buttons
      if (currentTool === 'ip') {
        renderLink(ICON.map, 'View Map', 'https://www.google.com/maps?q=' + target);
        renderLink(ICON.radar, 'Shodan', 'https://www.shodan.io/host/' + target);
      } else if (currentTool === 'domain') {
        renderLink(ICON.shield, 'VirusTotal', 'https://www.virustotal.com/gui/domain/' + target);
        renderLink(ICON.history, 'Wayback', 'https://web.archive.org/web/*/' + target);
      }
    } catch (err) {
      term.innerText = '[!] TASK FAILED\n' + err.message;
    }
  }

  function renderLink(icon, name, url) {
    var a = document.createElement('a');
    a.className = 'link-tag';
    a.innerHTML = icon + '<span>' + name + '</span>';
    a.href = url;
    a.target = '_blank';
    document.getElementById('links-container').appendChild(a);
  }

  // Register PWA Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js')
        .catch(function (err) { console.log('SW registration failed: ', err); });
    });
  }
</script>

</body>
</html>
